default-cache-ttl 28800
max-cache-ttl 28800

# gpg-agent requires an absolute path here — it does not search PATH.
# pinentry-mac is TTY-independent, so agent-driven `git commit` still gets a
# prompt the user can see. pinentry-tty/-curses write to the calling process's
# tty, which for an agent is invisible (and curses fails in small windows).
# Linux: change to /usr/bin/pinentry-gnome3 (apt/dnf, not brew). It uses the
# desktop session when one exists and auto-falls back to curses when headless.
pinentry-program /opt/homebrew/bin/pinentry-mac
